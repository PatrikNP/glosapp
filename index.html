<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FF6B6B">
    <meta name="description" content="Glosträning för Ebbe & Tove">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Glosträning - Ebbe & Tove</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FF6B6B 0%, #FFE66D 50%, #4ECDC4 100%);
            min-height: 100vh;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            padding-left: max(20px, env(safe-area-inset-left));
            padding-right: max(20px, env(safe-area-inset-right));
            animation: gradientShift 10s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            background: linear-gradient(135deg, #FF6B6B, #4ECDC4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            font-size: 2.8em;
            font-weight: 800;
        }

        .user-select, .mode-select {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            min-height: 44px;
            touch-action: manipulation;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #FF8E53, #FF6B6B);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.5);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-secondary.active {
            background: linear-gradient(135deg, #4ECDC4, #44A08D);
            color: white;
            box-shadow: 0 4px 15px rgba(78, 205, 196, 0.4);
        }

        .quiz-area {
            margin-top: 30px;
        }

        .question-card {
            background: linear-gradient(135deg, #FFF9E6 0%, #E8F5F7 100%);
            padding: 35px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            border: 3px solid transparent;
            background-clip: padding-box;
            position: relative;
        }

        .question-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 20px;
            padding: 3px;
            background: linear-gradient(135deg, #FF6B6B, #4ECDC4);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: -1;
        }

        .question {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .hint {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 15px;
            text-align: center;
            font-style: italic;
        }

        .clue-button {
            background: linear-gradient(135deg, #FFE66D, #FFBE0B);
            color: #333;
            padding: 10px 20px;
            font-size: 0.9em;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(255, 230, 109, 0.4);
            font-weight: 600;
        }

        .clue-button:hover {
            background: linear-gradient(135deg, #FFBE0B, #FFE66D);
            transform: translateY(-2px);
        }

        .clue-box {
            background: linear-gradient(135deg, #FFF9E6, #FFFACD);
            border: 2px solid #FFE66D;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 1.1em;
            color: #666;
            box-shadow: 0 4px 12px rgba(255, 230, 109, 0.3);
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #FF6B6B;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.2);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .score {
            text-align: center;
            font-size: 1.2em;
            color: #666;
            margin-top: 15px;
        }

        .result-message {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 1.1em;
        }

        .correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }

        .incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }

        .week-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .week-card {
            background: linear-gradient(135deg, #FFE66D, #FFB627);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 182, 39, 0.3);
        }

        .week-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(255, 182, 39, 0.5);
        }

        .week-card h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .week-card p {
            color: #555;
            font-size: 0.9em;
        }

        .admin-section {
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #FF6B6B;
        }

        .word-list {
            max-height: 400px;
            overflow-y: auto;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
        }

        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid #FF6B6B;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            padding: 6px 12px;
            font-size: 0.9em;
            min-height: 36px;
        }

        .sync-status {
            text-align: center;
            padding: 10px;
            background: #fff3cd;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #856404;
            font-weight: 600;
            transition: opacity 0.3s;
        }

        .sync-status.hidden {
            display: none;
        }

        .hidden {
            display: none;
        }

        .progress-card {
            background: linear-gradient(135deg, #E8F5F7, #FFF9E6);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-left: 5px solid #4ECDC4;
        }

        .progress-card h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .stat-label {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: 800;
            background: linear-gradient(135deg, #FF6B6B, #4ECDC4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .results-history {
            max-height: 300px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: white;
            border-radius: 8px;
            margin-bottom: 5px;
            font-size: 0.95em;
            border-left: 3px solid #4ECDC4;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                border-radius: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .question-card {
                padding: 20px;
            }

            .controls {
                flex-direction: column;
                width: 100%;
            }

            .controls button {
                width: 100%;
            }

            .question {
                font-size: 1.1em;
            }
        }

        .error-box {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 2px solid #dc3545;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 Glosträning 🌟</h1>
        
        <div id="syncStatus" class="sync-status hidden">
            Synkar med Firebase...
        </div>

        <div id="errorBox" class="error-box hidden"></div>

        <div id="loadingIndicator" class="loading">
            Laddar app... ⏳
        </div>

        <div class="user-select" id="userButtons" style="display: none;">
            <button class="btn-secondary" onclick="window.selectUser('ebbe')">Ebbe</button>
            <button class="btn-secondary" onclick="window.selectUser('tove')">Tove</button>
            <button class="btn-secondary" onclick="window.showAdmin()">Admin</button>
            <button class="btn-secondary" onclick="window.showProgress()">Framsteg</button>
        </div>

        <!-- Quiz Section -->
        <div id="quizSection" class="hidden">
            <div id="weekSelection">
                <h2 style="text-align: center; color: #333; margin-bottom: 20px;">Välj vecka att träna</h2>
                <div id="weekGrid" class="week-grid"></div>
            </div>

            <div id="quizArea" class="quiz-area hidden"></div>
        </div>

        <!-- Admin Section -->
        <div id="adminSection" class="admin-section hidden">
            <h2 style="text-align: center; background: linear-gradient(135deg, #FF6B6B, #4ECDC4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 20px; font-weight: 800;">Admin Panel</h2>
            
            <div class="form-group">
                <label>Välj användare</label>
                <select id="adminUser">
                    <option value="ebbe">Ebbe</option>
                    <option value="tove">Tove</option>
                </select>
            </div>

            <div class="form-group">
                <label>Vecka (t.ex. "Vecka 3")</label>
                <input type="text" id="weekInput" placeholder="Vecka 3">
            </div>

            <div class="form-group">
                <label>Svenska</label>
                <input type="text" id="swedishWord" placeholder="Svenska ordet">
            </div>

            <div class="form-group">
                <label>Engelska</label>
                <input type="text" id="englishWord" placeholder="Engelska ordet">
            </div>

            <div class="form-group">
                <label>Ledtråd (valfritt)</label>
                <input type="text" id="clueInput" placeholder="Valfri ledtråd">
            </div>

            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;">
                <button class="btn-primary" onclick="window.addWord()" style="flex: 1; min-width: 200px;">Lägg till glosor</button>
                <button class="btn-secondary" onclick="window.resetDatabase()" style="background: linear-gradient(135deg, #dc3545, #c82333); color: white; flex: 1; min-width: 200px;">🔄 Återställ databas</button>
            </div>

            <div class="word-list" id="wordList"></div>

            <div style="margin-top: 20px;">
                <button class="btn-secondary" onclick="window.backToMain()">Tillbaka</button>
            </div>
        </div>

        <!-- Progress Section -->
        <div id="progressSection" class="admin-section hidden">
            <h2 style="text-align: center; background: linear-gradient(135deg, #FF6B6B, #4ECDC4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 20px; font-weight: 800;">Framsteg</h2>
            
            <div class="form-group">
                <label>Välj användare</label>
                <select id="progressUser" onchange="window.displayProgress()">
                    <option value="ebbe">Ebbe</option>
                    <option value="tove">Tove</option>
                </select>
            </div>

            <button class="btn-secondary" onclick="window.resetProgress()" style="margin-bottom: 20px;">Rensa framsteg</button>

            <div id="progressDisplay"></div>

            <div style="margin-top: 20px;">
                <button class="btn-secondary" onclick="window.backToMain()">Tillbaka</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK - Non-module version for better Safari/iPhone compatibility -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <script>
        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCZjOBDcyyLMQZDeQPKK0bpdRSh3prLs0M",
            authDomain: "patrikapps-cd169.firebaseapp.com",
            databaseURL: "https://patrikapps-cd169-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "patrikapps-cd169",
            storageBucket: "patrikapps-cd169.firebasestorage.app",
            messagingSenderId: "334803684499",
            appId: "1:334803684499:web:13c0f00c357ad5c97ed166"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        console.log('Firebase initialized successfully');

        // Global variables
        let vocabulary = { 
            ebbe: [], 
            tove: [
                { week: "Vecka 4", swedish: "jag letar efter", english: "I'm looking for", clue: "" },
                { week: "Vecka 4", swedish: "kjol", english: "skirt", clue: "" },
                { week: "Vecka 4", swedish: "kläder", english: "clothes", clue: "" },
                { week: "Vecka 4", swedish: "prova", english: "try on", clue: "" },
                { week: "Vecka 4", swedish: "tajt", english: "tight", clue: "" },
                { week: "Vecka 4", swedish: "storlek", english: "size", clue: "" },
                { week: "Vecka 4", swedish: "önska", english: "wish", clue: "" },
                { week: "Vecka 4", swedish: "vet du det?", english: "do you know that?", clue: "" },
                { week: "Vecka 4", swedish: "passa", english: "suit", clue: "" },
                { week: "Vecka 4", swedish: "Skämtar du?", english: "Are you kidding?", clue: "" },
                { week: "Vecka 4", swedish: "överdel", english: "top", clue: "" },
                { week: "Vecka 4", swedish: "halsduk", english: "scarf", clue: "" },
                { week: "Vecka 4", swedish: "provrum", english: "fitting room", clue: "" },
                { week: "Vecka 4", swedish: "där borta", english: "over there", clue: "" },
                { week: "Vecka 4", swedish: "några fler", english: "any more", clue: "" },
                { week: "Vecka 4", swedish: "för kort", english: "too short", clue: "" },
                { week: "Vecka 4", swedish: "i min storlek", english: "in my size", clue: "" },
                { week: "Vecka 4", swedish: "ta bussen", english: "catch a bus", clue: "" },
                { week: "Vecka 4", swedish: "värld", english: "world", clue: "" },
                { week: "Vecka 4", swedish: "den bästa som finns", english: "the best there is", clue: "" }
            ] 
        };
        let results = { ebbe: [], tove: [] };
        
        window.vocabulary = vocabulary;
        window.results = results;
        window.currentUser = '';
        window.currentWeek = '';
        window.direction = 'sv-en';
        window.currentWords = [];
        window.currentQuestionIndex = 0;
        window.score = 0;
        window.totalAnswered = 0;
        window.askedQuestions = [];
        window.wrongAnswers = [];
        window.partialAnswers = [];

        function showSyncStatus() {
            const status = document.getElementById('syncStatus');
            if (status) status.classList.remove('hidden');
        }

        function hideSyncStatus() {
            const status = document.getElementById('syncStatus');
            if (status) setTimeout(() => status.classList.add('hidden'), 1000);
        }

        function showError(message) {
            const errorBox = document.getElementById('errorBox');
            if (errorBox) {
                errorBox.textContent = message;
                errorBox.classList.remove('hidden');
                setTimeout(() => errorBox.classList.add('hidden'), 5000);
            }
            console.error(message);
        }

        function hideLoading() {
            const loading = document.getElementById('loadingIndicator');
            const buttons = document.getElementById('userButtons');
            if (loading) loading.style.display = 'none';
            if (buttons) buttons.style.display = 'flex';
        }

        // Firebase functions
        window.saveVocabulary = async function() {
            try {
                showSyncStatus();
                await database.ref('vocabulary').set(vocabulary);
                console.log('Vocabulary saved to Firebase');
            } catch (error) {
                showError('Kunde inte spara glosor: ' + error.message);
            } finally {
                hideSyncStatus();
            }
        };

        window.saveResults = async function() {
            try {
                showSyncStatus();
                await database.ref('results').set(results);
                console.log('Results saved to Firebase');
            } catch (error) {
                showError('Kunde inte spara resultat: ' + error.message);
            } finally {
                hideSyncStatus();
            }
        };

        window.loadData = async function() {
            try {
                showSyncStatus();
                
                // Load vocabulary
                const vocabSnapshot = await database.ref('vocabulary').once('value');
                if (vocabSnapshot.exists()) {
                    const loadedVocab = vocabSnapshot.val();
                    vocabulary.ebbe = loadedVocab.ebbe || [];
                    vocabulary.tove = loadedVocab.tove || [];
                    window.vocabulary = vocabulary;
                    console.log('Vocabulary loaded from Firebase');
                } else {
                    console.log('No existing vocabulary found, saving initial data...');
                    await window.saveVocabulary();
                }

                // Load results
                const resultsSnapshot = await database.ref('results').once('value');
                if (resultsSnapshot.exists()) {
                    const loadedResults = resultsSnapshot.val();
                    results.ebbe = loadedResults.ebbe || [];
                    results.tove = loadedResults.tove || [];
                    window.results = results;
                    console.log('Results loaded from Firebase');
                }

                hideLoading();
            } catch (error) {
                showError('Kunde inte ladda data från Firebase: ' + error.message);
                console.error('Error loading data:', error);
                hideLoading();
            } finally {
                hideSyncStatus();
            }
        };

        // Setup real-time listeners
        database.ref('vocabulary').on('value', (snapshot) => {
            if (snapshot.exists()) {
                const loadedVocab = snapshot.val();
                vocabulary.ebbe = loadedVocab.ebbe || [];
                vocabulary.tove = loadedVocab.tove || [];
                window.vocabulary = vocabulary;
                console.log('Real-time vocabulary update');
            }
        }, (error) => {
            console.error('Error listening to vocabulary:', error);
        });

        database.ref('results').on('value', (snapshot) => {
            if (snapshot.exists()) {
                const loadedResults = snapshot.val();
                results.ebbe = loadedResults.ebbe || [];
                results.tove = loadedResults.tove || [];
                window.results = results;
                console.log('Real-time results update');
            }
        }, (error) => {
            console.error('Error listening to results:', error);
        });

        // Load data on startup
        loadData();

        // Navigation functions
        window.backToMain = function() {
            document.getElementById('quizSection').classList.add('hidden');
            document.getElementById('adminSection').classList.add('hidden');
            document.getElementById('progressSection').classList.add('hidden');
        };

        window.selectUser = function(user) {
            window.currentUser = user;
            document.querySelectorAll('.user-select button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('quizSection').classList.remove('hidden');
            document.getElementById('adminSection').classList.add('hidden');
            document.getElementById('progressSection').classList.add('hidden');
            document.getElementById('quizArea').classList.add('hidden');
            document.getElementById('weekSelection').classList.remove('hidden');
            window.showWeeks();
        };

        window.showAdmin = function() {
            document.getElementById('quizSection').classList.add('hidden');
            document.getElementById('adminSection').classList.remove('hidden');
            document.getElementById('progressSection').classList.add('hidden');
            window.displayWordList();
        };

        window.showProgress = function() {
            document.getElementById('quizSection').classList.add('hidden');
            document.getElementById('adminSection').classList.add('hidden');
            document.getElementById('progressSection').classList.remove('hidden');
            window.displayProgress();
        };

        window.showWeeks = function() {
            const userVocab = vocabulary[window.currentUser];
            if (!userVocab || !Array.isArray(userVocab)) {
                document.getElementById('weekGrid').innerHTML = '<p style="text-align: center; color: #999; grid-column: 1/-1;">Inga glosor tillagda än. Gå till Admin för att lägga till!</p>';
                return;
            }
            
            const weeks = [...new Set(userVocab.map(w => w.week))].sort();
            const grid = document.getElementById('weekGrid');
            
            if (weeks.length === 0) {
                grid.innerHTML = '<p style="text-align: center; color: #999; grid-column: 1/-1;">Inga glosor tillagda än. Gå till Admin för att lägga till!</p>';
                return;
            }

            grid.innerHTML = weeks.map(week => {
                const wordCount = userVocab.filter(w => w.week === week).length;
                return `
                    <div class="week-card" onclick="window.selectWeek('${week}')">
                        <h3>${week}</h3>
                        <p>${wordCount} glosor</p>
                    </div>
                `;
            }).join('');
        };

        window.selectWeek = function(week) {
            window.currentWeek = week;
            document.getElementById('weekSelection').classList.add('hidden');
            document.getElementById('quizArea').classList.remove('hidden');
            window.showModeSelection();
        };

        window.showModeSelection = function() {
            document.getElementById('quizArea').innerHTML = `
                <div class="question-card">
                    <h2 style="text-align: center; color: #333; margin-bottom: 20px;">Välj träningsriktning</h2>
                    <div class="mode-select">
                        <button class="btn-primary" onclick="window.startQuiz('sv-en')">Svenska → Engelska</button>
                        <button class="btn-primary" onclick="window.startQuiz('en-sv')">Engelska → Svenska</button>
                    </div>
                    <div style="text-align: center; margin-top: 15px;">
                        <button class="btn-secondary" onclick="window.backToWeeks()">Tillbaka</button>
                    </div>
                </div>
            `;
        };

        window.backToWeeks = function() {
            document.getElementById('weekSelection').classList.remove('hidden');
            document.getElementById('quizArea').classList.add('hidden');
            window.showWeeks();
        };

        window.startQuiz = function(dir) {
            window.direction = dir;
            window.currentWords = vocabulary[window.currentUser].filter(w => w.week === window.currentWeek);
            window.currentWords = window.currentWords.sort(() => Math.random() - 0.5);
            window.currentQuestionIndex = 0;
            window.score = 0;
            window.totalAnswered = 0;
            window.askedQuestions = [];
            window.wrongAnswers = [];
            window.partialAnswers = [];
            window.showQuestion();
        };

        window.showQuestion = function() {
            if (window.currentQuestionIndex >= window.currentWords.length) {
                window.showFinalScore();
                return;
            }

            const word = window.currentWords[window.currentQuestionIndex];
            const question = window.direction === 'sv-en' ? word.swedish : word.english;
            const hint = window.direction === 'sv-en' ? 'Skriv på engelska' : 'Skriv på svenska';
            const correctAnswer = window.direction === 'sv-en' ? word.english : word.swedish;

            let html = `
                <div class="question-card">
                    <div class="question">${question}</div>
                    <div class="hint">${hint}</div>
                    <div id="clueArea"></div>
                    <button class="clue-button" onclick="window.showLetterClue()">💡 Visa ledtråd (2 bokstäver)</button>
            `;

            if (word.clue && word.clue.trim() !== '') {
                html += `<button class="clue-button" style="background: linear-gradient(135deg, #95E1D3, #38ADA9);" onclick="window.showCustomClue()">💬 Extra ledtråd</button>`;
            }

            html += `
                    <input type="text" id="answerInput" placeholder="Skriv ditt svar här..." onkeypress="window.handleEnter(event)" autocomplete="off">
                    <div class="controls">
                        <button class="btn-primary" onclick="window.checkAnswer()">Svara</button>
                        <button class="btn-secondary" onclick="window.skipQuestion()">Hoppa över</button>
                    </div>
                </div>
                <div class="score" id="scoreDisplay"></div>
            `;

            document.getElementById('quizArea').innerHTML = html;
            setTimeout(() => {
                const input = document.getElementById('answerInput');
                if (input) input.focus();
            }, 100);
            window.updateScore();
        };

        window.showLetterClue = function() {
            const word = window.currentWords[window.currentQuestionIndex];
            const answer = window.direction === 'sv-en' ? word.english : word.swedish;
            const clue = answer.substring(0, 2) + '*'.repeat(Math.max(0, answer.length - 2));
            
            const clueArea = document.getElementById('clueArea');
            if (clueArea) {
                clueArea.innerHTML = `<div class="clue-box">${clue}</div>`;
            }
        };

        window.showCustomClue = function() {
            const word = window.currentWords[window.currentQuestionIndex];
            const clueArea = document.getElementById('clueArea');
            if (clueArea) {
                clueArea.innerHTML = `<div class="clue-box">${word.clue}</div>`;
            }
        };

        window.handleEnter = function(event) {
            if (event.key === 'Enter') {
                window.checkAnswer();
            }
        };

        window.checkAnswer = function() {
            const word = window.currentWords[window.currentQuestionIndex];
            const userAnswer = document.getElementById('answerInput').value.trim().toLowerCase();
            const correctAnswer = (window.direction === 'sv-en' ? word.english : word.swedish).toLowerCase();

            window.totalAnswered++;
            let isCorrect = false;

            if (userAnswer === correctAnswer) {
                window.score++;
                isCorrect = true;
            } else if (userAnswer.split(' ').some(part => correctAnswer.includes(part)) || 
                       correctAnswer.split(' ').some(part => userAnswer.includes(part))) {
                window.partialAnswers.push({ word, userAnswer, correctAnswer });
            } else {
                window.wrongAnswers.push({ word, userAnswer, correctAnswer });
            }

            window.askedQuestions.push({ word, direction: window.direction, correct: isCorrect });

            let resultMessage = isCorrect 
                ? `<div class="result-message correct">✅ Rätt! "${correctAnswer}"</div>` 
                : `<div class="result-message incorrect">❌ Fel! Rätt svar är "${correctAnswer}"</div>`;

            document.getElementById('quizArea').innerHTML = resultMessage + 
                `<div style="text-align: center; margin-top: 15px;">
                    <button class="btn-primary" onclick="window.nextQuestion()">Nästa fråga</button>
                </div>`;
        };

        window.skipQuestion = function() {
            window.askedQuestions.push({ word: window.currentWords[window.currentQuestionIndex], skipped: true });
            window.nextQuestion();
        };

        window.nextQuestion = function() {
            window.currentQuestionIndex++;
            window.showQuestion();
        };

        window.showFinalScore = function() {
            const percentage = Math.round((window.score / window.totalAnswered) * 100);
            
            const now = new Date();
            const date = now.toLocaleDateString('sv-SE');
            const time = now.toLocaleTimeString('sv-SE').substring(0, 5);
            const directionText = window.direction === 'sv-en' ? 'Svenska → Engelska' : 'Engelska → Svenska';

            const result = {
                date,
                time,
                week: window.currentWeek,
                score: window.score,
                maxScore: window.totalAnswered,
                percentage,
                direction: directionText
            };

            window.results[window.currentUser].push(result);
            window.saveResults();

            let html = `
                <div class="question-card">
                    <h2 style="text-align: center; color: #333;">Quiz Slut!</h2>
                    <div class="result-message" style="border: 3px solid #4ECDC4; background: linear-gradient(135deg, #D4EDDA, #E8F5F7);">
                        <div style="font-size: 2em; font-weight: 800; color: #155724;">${window.score}/${window.totalAnswered}</div>
                        <div style="font-size: 1.5em; margin-top: 10px;">${percentage}%</div>
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="btn-primary" onclick="window.backToWeeks()">Ny träning</button>
                    </div>
                </div>
            `;

            document.getElementById('quizArea').innerHTML = html;
        };

        window.updateScore = function() {
            const scoreDisplay = document.getElementById('scoreDisplay');
            if (scoreDisplay) {
                scoreDisplay.textContent = `Poäng: ${window.score}/${window.totalAnswered}`;
            }
        };

        window.displayProgress = function() {
            const user = document.getElementById('progressUser').value;
            const displayDiv = document.getElementById('progressDisplay');
            const userResults = window.results[user] || [];
            
            if (userResults.length === 0) {
                displayDiv.innerHTML = '<p style="text-align: center; color: #999;">Inga resultat än</p>';
                return;
            }

            const weekResults = userResults.filter(r => r.week === window.currentWeek);
            
            // Group by week
            const resultsByWeek = {};
            userResults.forEach(result => {
                if (!resultsByWeek[result.week]) resultsByWeek[result.week] = [];
                resultsByWeek[result.week].push(result);
            });

            let html = '';

            Object.keys(resultsByWeek).forEach(week => {
                const weekResults = resultsByWeek[week];
                const attempts = weekResults.length;
                const avgScore = Math.round(weekResults.reduce((sum, r) => sum + r.percentage, 0) / attempts);
                const bestScore = Math.max(...weekResults.map(r => r.percentage));
                const latestScore = weekResults[weekResults.length - 1].percentage;

                html += `
                    <div class="progress-card">
                        <h3>${week}</h3>
                        <div class="stats-container">
                            <div class="stat-item">
                                <div class="stat-label">Antal försök</div>
                                <div class="stat-value">${attempts}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Genomsnitt</div>
                                <div class="stat-value">${avgScore}%</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Bästa resultat</div>
                                <div class="stat-value">${bestScore}%</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Senaste resultat</div>
                                <div class="stat-value">${latestScore}%</div>
                            </div>
                        </div>
                        <div class="results-history">
                            <h4 style="margin: 15px 0 10px 0; color: #666;">Historik:</h4>
                `;

                weekResults.reverse().forEach(result => {
                    const scoreColor = result.percentage >= 80 ? '#28a745' : result.percentage >= 60 ? '#ffc107' : '#dc3545';
                    html += `
                        <div class="history-item">
                            <span>${result.date} ${result.time}</span>
                            <span>${result.direction}</span>
                            <span style="color: ${scoreColor}; font-weight: bold;">${result.score}/${result.maxScore} (${result.percentage}%)</span>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            displayDiv.innerHTML = html;
        };

        window.resetProgress = function() {
            const user = document.getElementById('progressUser').value;
            const userName = user === 'ebbe' ? 'Ebbe' : 'Tove';
            
            if (confirm(`Är du säker på att du vill radera alla framsteg för ${userName}? Detta går inte att ångra.`)) {
                window.results[user] = [];
                window.saveResults();
                window.displayProgress();
                alert(`Framsteg för ${userName} har raderats.`);
            }
        };

        window.addWord = function() {
            const user = document.getElementById('adminUser').value;
            const week = document.getElementById('weekInput').value;
            const swedish = document.getElementById('swedishWord').value;
            const english = document.getElementById('englishWord').value;
            const clue = document.getElementById('clueInput').value;

            if (!week || !swedish || !english) {
                alert('Fyll i vecka, svenska och engelska ord!');
                return;
            }

            vocabulary[user].push({ week, swedish, english, clue: clue || '' });
            window.saveVocabulary();
            
            document.getElementById('weekInput').value = week;
            document.getElementById('swedishWord').value = '';
            document.getElementById('englishWord').value = '';
            document.getElementById('clueInput').value = '';
            document.getElementById('swedishWord').focus();
            
            window.displayWordList();
        };

        window.displayWordList = function() {
            const user = document.getElementById('adminUser').value;
            const listElement = document.getElementById('wordList');
            
            if (!vocabulary[user] || !Array.isArray(vocabulary[user]) || vocabulary[user].length === 0) {
                listElement.innerHTML = '<p style="text-align: center; color: #999;">Inga glosor tillagda än</p>';
                return;
            }

            let html = '<h3 style="background: linear-gradient(135deg, #FF6B6B, #4ECDC4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 15px; font-weight: 800;">Glosor för ' + 
                       (user === 'ebbe' ? 'Ebbe' : 'Tove') + '</h3>';
            
            const byWeek = {};
            vocabulary[user].forEach((word, index) => {
                if (!byWeek[word.week]) byWeek[word.week] = [];
                byWeek[word.week].push({...word, globalIndex: index});
            });

            Object.keys(byWeek).sort().forEach(week => {
                html += `<h4 style="margin-top: 20px; margin-bottom: 10px; color: #FF6B6B;">${week}</h4>`;
                byWeek[week].forEach((word, weekIndex) => {
                    const clueText = word.clue ? ` 💡 "${word.clue}"` : '';
                    html += `
                        <div class="word-item">
                            <span><strong>#${weekIndex + 1}:</strong> ${word.swedish} - ${word.english}${clueText}</span>
                            <button class="delete-btn" onclick="window.deleteWord('${user}', ${word.globalIndex})">Ta bort</button>
                        </div>
                    `;
                });
            });

            listElement.innerHTML = html;
        };

        window.deleteWord = function(user, index) {
            vocabulary[user].splice(index, 1);
            window.saveVocabulary();
            window.displayWordList();
        };

        window.resetDatabase = async function() {
            if (!confirm('⚠️ VARNING! Detta kommer radera ALLA glosor och resultat för BÅDA användare och återställa till startläge. Är du säker?')) {
                return;
            }
            if (!confirm('Är du VERKLIGEN säker? Detta går inte att ångra!')) {
                return;
            }
            
            try {
                showSyncStatus();
                
                // Reset to initial data
                vocabulary = {
                    ebbe: [],
                    tove: [
                        { week: "Vecka 4", swedish: "jag letar efter", english: "I'm looking for", clue: "" },
                        { week: "Vecka 4", swedish: "kjol", english: "skirt", clue: "" },
                        { week: "Vecka 4", swedish: "kläder", english: "clothes", clue: "" },
                        { week: "Vecka 4", swedish: "prova", english: "try on", clue: "" },
                        { week: "Vecka 4", swedish: "tajt", english: "tight", clue: "" },
                        { week: "Vecka 4", swedish: "storlek", english: "size", clue: "" },
                        { week: "Vecka 4", swedish: "önska", english: "wish", clue: "" },
                        { week: "Vecka 4", swedish: "vet du det?", english: "do you know that?", clue: "" },
                        { week: "Vecka 4", swedish: "passa", english: "suit", clue: "" },
                        { week: "Vecka 4", swedish: "Skämtar du?", english: "Are you kidding?", clue: "" },
                        { week: "Vecka 4", swedish: "överdel", english: "top", clue: "" },
                        { week: "Vecka 4", swedish: "halsduk", english: "scarf", clue: "" },
                        { week: "Vecka 4", swedish: "provrum", english: "fitting room", clue: "" },
                        { week: "Vecka 4", swedish: "där borta", english: "over there", clue: "" },
                        { week: "Vecka 4", swedish: "några fler", english: "any more", clue: "" },
                        { week: "Vecka 4", swedish: "för kort", english: "too short", clue: "" },
                        { week: "Vecka 4", swedish: "i min storlek", english: "in my size", clue: "" },
                        { week: "Vecka 4", swedish: "ta bussen", english: "catch a bus", clue: "" },
                        { week: "Vecka 4", swedish: "värld", english: "world", clue: "" },
                        { week: "Vecka 4", swedish: "den bästa som finns", english: "the best there is", clue: "" }
                    ]
                };
                results = {
                    ebbe: [],
                    tove: []
                };
                
                window.vocabulary = vocabulary;
                window.results = results;
                
                // Save to Firebase
                await database.ref('vocabulary').set(vocabulary);
                await database.ref('results').set(results);
                
                console.log('Clean data saved to Firebase');
                
                alert('✅ Databasen har återställts!\n\nEbbe: 0 glosor\nTove: Vecka 4 (20 glosor)\n\nLadda om sidan för att se ändringarna.');
                window.displayWordList();
                hideSyncStatus();
                
                // Reload page
                setTimeout(() => location.reload(), 2000);
            } catch (error) {
                showError('Kunde inte återställa databasen: ' + error.message);
                hideSyncStatus();
            }
        };

        document.getElementById('adminUser').addEventListener('change', window.displayWordList);

        // Service Worker registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker registration failed:', err));
        }

        console.log('App initialized successfully');
    </script>
</body>
</html>
