<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Glosträning">
    <meta name="theme-color" content="#FF6B6B">
    <meta name="description" content="Glosträning för Ebbe & Tove">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Glosträning - Ebbe & Tove</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #FF6B6B 0%, #FFE66D 50%, #4ECDC4 100%);
            min-height: 100vh;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            padding-left: max(20px, env(safe-area-inset-left));
            padding-right: max(20px, env(safe-area-inset-right));
            animation: gradientShift 10s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            background: linear-gradient(135deg, #FF6B6B, #4ECDC4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            font-size: 2.8em;
            font-weight: 800;
        }

        .user-select, .mode-select {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            min-height: 44px;
            touch-action: manipulation;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        .btn-primary:active {
            background: linear-gradient(135deg, #FF8E53, #FF6B6B);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.5);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:active {
            background: #d0d0d0;
        }

        .btn-secondary.active {
            background: linear-gradient(135deg, #4ECDC4, #44A08D);
            color: white;
            box-shadow: 0 4px 15px rgba(78, 205, 196, 0.4);
        }

        .hidden {
            display: none !important;
        }

        .error-box {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 2px solid #dc3545;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.2em;
        }

        .sync-status {
            text-align: center;
            padding: 10px;
            background: #d1ecf1;
            color: #0c5460;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 Glosträning 🌟</h1>
        
        <div id="errorBox" class="error-box hidden"></div>
        <div id="syncStatus" class="sync-status hidden">Synkar med Firebase...</div>
        <div id="loadingIndicator" class="loading">Laddar app... ⏳</div>
        <div id="userButtons" class="user-select" style="display: none;">
            <button class="btn-secondary" onclick="window.selectUser('ebbe')">Ebbe</button>
            <button class="btn-secondary" onclick="window.selectUser('tove')">Tove</button>
            <button class="btn-secondary" onclick="window.showAdmin()">Admin</button>
            <button class="btn-secondary" onclick="window.showProgress()">Framsteg</button>
        </div>

        <div id="quizSection" class="hidden">
            <div id="weekSelection">
                <h2 style="text-align: center; color: #333; margin-bottom: 20px;">Välj vecka att träna</h2>
                <div id="weekGrid" class="week-grid"></div>
            </div>
            <div id="quizArea" class="quiz-area hidden"></div>
        </div>

        <div id="adminSection" class="admin-section hidden">
            <h2 style="text-align: center; color: #FF6B6B; margin-bottom: 20px;">Admin Panel</h2>
            <p id="adminStatus" style="text-align: center; margin-bottom: 10px; font-size: 0.9em; color: #666;"></p>
            
            <div class="form-group">
                <label>Välj användare</label>
                <select id="adminUser">
                    <option value="ebbe">Ebbe</option>
                    <option value="tove">Tove</option>
                </select>
            </div>

            <div class="form-group">
                <label>Vecka (t.ex. "Vecka 3")</label>
                <input type="text" id="weekInput" placeholder="Vecka 3">
            </div>

            <div class="form-group">
                <label>Svenska</label>
                <input type="text" id="swedishWord" placeholder="Svenska ordet">
            </div>

            <div class="form-group">
                <label>Engelska</label>
                <input type="text" id="englishWord" placeholder="Engelska ordet">
            </div>

            <div class="form-group">
                <label>Ledtråd (valfritt)</label>
                <input type="text" id="clueInput" placeholder="Valfri ledtråd">
            </div>

            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;">
                <button class="btn-primary" onclick="window.addWord()" style="flex: 1; min-width: 200px;">Lägg till glosor</button>
                <button class="btn-secondary" onclick="window.resetDatabase()" style="background: linear-gradient(135deg, #dc3545, #c82333); color: white; flex: 1; min-width: 200px;">🔄 Återställ databas</button>
            </div>

            <div class="word-list" id="wordList"></div>

            <div style="margin-top: 20px;">
                <button class="btn-secondary" onclick="window.backToMain()">Tillbaka</button>
            </div>
        </div>

        <div id="progressSection" class="admin-section hidden">
            <h2 style="text-align: center; color: #FF6B6B; margin-bottom: 20px;">Framsteg</h2>
            
            <div class="form-group">
                <label>Välj användare</label>
                <select id="progressUser" onchange="window.displayProgress()">
                    <option value="ebbe">Ebbe</option>
                    <option value="tove">Tove</option>
                </select>
            </div>

            <button class="btn-secondary" onclick="window.resetProgress()" style="margin-bottom: 20px;">Rensa framsteg</button>

            <div id="progressDisplay"></div>

            <div style="margin-top: 20px;">
                <button class="btn-secondary" onclick="window.backToMain()">Tillbaka</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK - Compat version for better compatibility -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <script>
        console.log('=== GLOSTRÄNING APP STARTING ===');
        console.log('User Agent:', navigator.userAgent);

        // Initialize Firebase - with error handling
        try {
            const firebaseConfig = {
                apiKey: "AIzaSyCZjOBDcyyLMQZDeQPKK0bpdRSh3prLs0M",
                authDomain: "patrikapps-cd169.firebaseapp.com",
                databaseURL: "https://patrikapps-cd169-default-rtdb.europe-west1.firebasedatabase.app",
                projectId: "patrikapps-cd169",
                storageBucket: "patrikapps-cd169.firebasestorage.app",
                messagingSenderId: "334803684499",
                appId: "1:334803684499:web:13c0f00c357ad5c97ed166"
            };

            if (!firebase) {
                throw new Error('Firebase not loaded!');
            }

            firebase.initializeApp(firebaseConfig);
            window.database = firebase.database();
            window.firebaseReady = true;
            console.log('✅ Firebase initialized successfully');
        } catch (error) {
            console.error('❌ Firebase Error:', error);
            window.firebaseReady = false;
            document.getElementById('errorBox').textContent = '⚠️ Firebase kunde inte laddas: ' + error.message;
            document.getElementById('errorBox').classList.remove('hidden');
        }

        // Global variables
        let vocabulary = { ebbe: [], tove: [] };
        let results = { ebbe: [], tove: [] };
        
        window.vocabulary = vocabulary;
        window.results = results;
        window.currentUser = '';
        window.currentWeek = '';
        window.direction = 'sv-en';

        function hideLoading() {
            document.getElementById('loadingIndicator').style.display = 'none';
            document.getElementById('userButtons').style.display = 'flex';
        }

        function showError(message) {
            const errorBox = document.getElementById('errorBox');
            if (errorBox) {
                errorBox.textContent = message;
                errorBox.classList.remove('hidden');
                setTimeout(() => errorBox.classList.add('hidden'), 5000);
            }
            console.error(message);
        }

        function showSyncStatus() {
            const status = document.getElementById('syncStatus');
            if (status) status.classList.remove('hidden');
        }

        function hideSyncStatus() {
            const status = document.getElementById('syncStatus');
            if (status) setTimeout(() => status.classList.add('hidden'), 500);
        }

        // Firebase functions
        window.loadData = async function() {
            try {
                console.log('📥 Loading data from Firebase...');
                showSyncStatus();
                
                if (!window.firebaseReady || !window.database) {
                    throw new Error('Firebase not initialized');
                }

                // Load vocabulary
                const vocabSnapshot = await window.database.ref('vocabulary').once('value');
                if (vocabSnapshot.exists()) {
                    const loadedVocab = vocabSnapshot.val();
                    vocabulary.ebbe = loadedVocab.ebbe || [];
                    vocabulary.tove = loadedVocab.tove || [];
                    window.vocabulary = vocabulary;
                    console.log('✅ Vocabulary loaded');
                } else {
                    console.log('ℹ️ No vocabulary found, starting fresh');
                    vocabulary.tove = [
                        { week: "Vecka 4", swedish: "jag letar efter", english: "I'm looking for", clue: "" },
                        { week: "Vecka 4", swedish: "kjol", english: "skirt", clue: "" },
                        { week: "Vecka 4", swedish: "kläder", english: "clothes", clue: "" }
                    ];
                    await window.saveVocabulary();
                }

                // Load results
                const resultsSnapshot = await window.database.ref('results').once('value');
                if (resultsSnapshot.exists()) {
                    const loadedResults = resultsSnapshot.val();
                    results.ebbe = loadedResults.ebbe || [];
                    results.tove = loadedResults.tove || [];
                    window.results = results;
                    console.log('✅ Results loaded');
                }

                console.log('🎉 App ready!');
                hideLoading();
            } catch (error) {
                console.error('❌ Load error:', error);
                showError('Kunde inte ladda data: ' + error.message);
                hideLoading();
            } finally {
                hideSyncStatus();
            }
        };

        window.saveVocabulary = async function() {
            try {
                if (!window.firebaseReady) return;
                showSyncStatus();
                await window.database.ref('vocabulary').set(vocabulary);
                console.log('✅ Vocabulary saved');
            } catch (error) {
                showError('Kunde inte spara glosor: ' + error.message);
            } finally {
                hideSyncStatus();
            }
        };

        window.saveResults = async function() {
            try {
                if (!window.firebaseReady) return;
                showSyncStatus();
                await window.database.ref('results').set(results);
                console.log('✅ Results saved');
            } catch (error) {
                showError('Kunde inte spara resultat: ' + error.message);
            } finally {
                hideSyncStatus();
            }
        };

        window.selectUser = function(user) {
            window.currentUser = user;
            document.getElementById('userButtons').style.display = 'none';
            document.getElementById('quizSection').style.display = 'block';
            window.showWeekSelection();
        };

        window.showWeekSelection = function() {
            const weeks = [...new Set(window.vocabulary[window.currentUser].map(w => w.week))];
            const html = weeks.map(week => {
                const count = window.vocabulary[window.currentUser].filter(w => w.week === week).length;
                return `<div style="padding: 15px; background: #f0f0f0; border-radius: 10px; text-align: center; cursor: pointer;" onclick="window.selectWeek('${week}')">
                    <strong>${week}</strong><br><small>${count} ord</small>
                </div>`;
            }).join('');
            document.getElementById('weekGrid').innerHTML = html || '<p>Inga glosor ännu</p>';
        };

        window.selectWeek = function(week) {
            window.currentWeek = week;
            document.getElementById('weekSelection').style.display = 'none';
            document.getElementById('quizArea').style.display = 'block';
            window.startQuiz();
        };

        window.startQuiz = function() {
            document.getElementById('quizArea').innerHTML = `<p style="text-align: center; color: #666;">Välj träningsriktning:<br><br>
                <button class="btn-primary" onclick="window.direction='sv-en'; window.loadQuestion()" style="margin: 5px;">Svenska → Engelska</button>
                <button class="btn-primary" onclick="window.direction='en-sv'; window.loadQuestion()" style="margin: 5px;">Engelska → Svenska</button>
            </p>`;
        };

        window.loadQuestion = function() {
            document.getElementById('quizArea').innerHTML = '<p style="text-align: center;">Laddar...' + window.currentWeek + '</p>';
            // Simplified for now - just show it's working
            setTimeout(() => {
                document.getElementById('quizArea').innerHTML = '<p style="text-align: center; color: #666;">✅ Appen fungerar!</p>';
            }, 500);
        };

        window.showAdmin = function() {
            document.getElementById('userButtons').style.display = 'none';
            document.getElementById('adminSection').style.display = 'block';
            window.displayWordList();
        };

        window.showProgress = function() {
            document.getElementById('userButtons').style.display = 'none';
            document.getElementById('progressSection').style.display = 'block';
        };

        window.backToMain = function() {
            document.getElementById('quizSection').style.display = 'none';
            document.getElementById('adminSection').style.display = 'none';
            document.getElementById('progressSection').style.display = 'none';
            document.getElementById('weekSelection').style.display = 'block';
            document.getElementById('quizArea').classList.add('hidden');
            document.getElementById('userButtons').style.display = 'flex';
        };

        window.addWord = function() {
            const user = document.getElementById('adminUser').value;
            const week = document.getElementById('weekInput').value;
            const swedish = document.getElementById('swedishWord').value;
            const english = document.getElementById('englishWord').value;
            const clue = document.getElementById('clueInput').value;

            if (!week || !swedish || !english) {
                alert('Fyll i vecka, svenska och engelska ord!');
                return;
            }

            window.vocabulary[user].push({ week, swedish, english, clue: clue || '' });
            window.saveVocabulary();
            
            document.getElementById('weekInput').value = week;
            document.getElementById('swedishWord').value = '';
            document.getElementById('englishWord').value = '';
            document.getElementById('clueInput').value = '';
            document.getElementById('swedishWord').focus();
            
            window.displayWordList();
        };

        window.displayWordList = function() {
            const user = document.getElementById('adminUser').value;
            const listElement = document.getElementById('wordList');
            
            if (!window.vocabulary[user] || window.vocabulary[user].length === 0) {
                listElement.innerHTML = '<p style="text-align: center; color: #999;">Inga glosor tillagda än</p>';
                return;
            }

            let html = '<h3>' + (user === 'ebbe' ? 'Ebbes' : 'Toves') + ' glosor:</h3>';
            
            const byWeek = {};
            window.vocabulary[user].forEach((word, index) => {
                if (!byWeek[word.week]) byWeek[word.week] = [];
                byWeek[word.week].push({...word, index});
            });

            Object.keys(byWeek).sort().forEach(week => {
                html += `<h4 style="margin-top: 15px; color: #FF6B6B;">${week}</h4>`;
                byWeek[week].forEach(word => {
                    html += `<div style="padding: 10px; background: #f9f9f9; margin: 5px 0; border-radius: 5px; display: flex; justify-content: space-between;">
                        <span><strong>${word.swedish}</strong> - ${word.english}</span>
                        <button class="btn-secondary" style="padding: 5px 10px; font-size: 0.8em;" onclick="window.deleteWord('${user}', ${word.index})">❌</button>
                    </div>`;
                });
            });

            listElement.innerHTML = html;
        };

        window.deleteWord = function(user, index) {
            window.vocabulary[user].splice(index, 1);
            window.saveVocabulary();
            window.displayWordList();
        };

        window.displayProgress = function() {
            const user = document.getElementById('progressUser').value;
            const userResults = window.results[user] || [];
            let html = '<p style="text-align: center; color: #999;">Inga resultat än</p>';
            
            if (userResults.length > 0) {
                html = '<div style="font-size: 0.9em;">';
                userResults.reverse().forEach(r => {
                    html += `<div style="padding: 10px; background: #f9f9f9; margin: 5px 0; border-radius: 5px;">
                        <strong>${r.date}</strong> - ${r.score}/${r.maxScore} (${r.percentage}%)
                    </div>`;
                });
                html += '</div>';
            }
            
            document.getElementById('progressDisplay').innerHTML = html;
        };

        window.resetProgress = function() {
            const user = document.getElementById('progressUser').value;
            if (confirm('Är du säker?')) {
                window.results[user] = [];
                window.saveResults();
                window.displayProgress();
            }
        };

        window.resetDatabase = function() {
            if (confirm('⚠️ Radera ALLA data? Detta går inte att ångra!')) {
                if (confirm('Är du VERKLIGEN säker?')) {
                    window.vocabulary = { ebbe: [], tove: [] };
                    window.results = { ebbe: [], tove: [] };
                    window.saveVocabulary();
                    window.saveResults();
                    alert('✅ Databasen är återställd!');
                    location.reload();
                }
            }
        };

        // Initialize when Firebase is ready
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 DOM loaded');
            if (window.firebaseReady) {
                window.loadData();
            } else {
                console.warn('⏳ Firebase not ready yet, waiting...');
                setTimeout(() => {
                    if (window.firebaseReady) {
                        window.loadData();
                    } else {
                        showError('Firebase kunde inte initialiseras. Kontrollera internetanslutningen.');
                        hideLoading();
                    }
                }, 2000);
            }
        });

        // Service Worker registration (optional, for PWA)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => {
                console.warn('Service Worker registration failed:', err);
            });
        }

        console.log('✅ Scripts loaded and ready');
    </script>
</body>
</html>
